[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ep-tracker"
version = "0.1.0"
description = "Git-backed team project and task tracker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Expected Parrot, Inc."}]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
fielding = ["edsl>=1.0.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tracker = "ep_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ep_tracker = ["templates/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
